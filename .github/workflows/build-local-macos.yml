name: Build local macOS app

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: local-macos-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    # Upstream's app build took 302 seconds in run 41125246998. Allow
    # another build for the debug tests, with a 25 percent margin.
    timeout-minutes: 13
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Install Zig
        run: |
          curl --fail --location https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a "$RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.17.0" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            .zig-global-cache
            .zig-cache
            zig-pkg
          key: macos-arm64-zig-0.17.0-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}
          restore-keys: |
            macos-arm64-zig-0.17.0-${{ hashFiles('build.zig.zon') }}-

      - name: Install build dependencies
        run: brew install gettext

      - name: Build app
        run: zig build -Doptimize=fast -Dxcframework-target=native

      - name: Check tmux integration
        run: zig build test -Dtest-filter=tmux -Dtest-filter=SplitTree -Dtest-filter=termio

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: |
            .zig-global-cache
            .zig-cache
            zig-pkg
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package app
        run: |
          git rev-parse HEAD > build-commit.txt
          zig-out/Ghostty.app/Contents/MacOS/ghostty --version
          ditto -c -k --keepParent zig-out/Ghostty.app Ghostty-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ghostty-macos-arm64
          path: |
            Ghostty-macos-arm64.zip
            build-commit.txt
          if-no-files-found: error
